<!doctype html><html lang="en"><head><meta charset="utf-8"></head><body>
<details class="sc-filter" open><summary>Countries (3)</summary>
<div class="sc-filter__panel"><div class="sc-filter__clear"><button class="sc-btn sc-btn--neutral" type="button">Clear filter</button></div>
<div class="sc-filter__groups">
<fieldset><legend><label class="sc-check"><input type="checkbox" checked>Asia</label></legend><label class="sc-check sc-check--in"><input type="checkbox" checked>Japan</label></fieldset>
<fieldset><legend><label class="sc-check"><input type="checkbox" id="eu">Europe</label></legend><label class="sc-check sc-check--in"><input type="checkbox" checked>England</label><label class="sc-check sc-check--in"><input type="checkbox" checked>France</label><label class="sc-check sc-check--in"><input type="checkbox">Italy</label></fieldset>
</div></div></details>
<script>document.getElementById('eu').indeterminate=true</script>
</body></html>
