<!-- @dsCard group="Aviary" height=420 subtitle="A Bird opened over its tile: Pictures in the media column, flags and Songs as tags, Sightings" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><style>.tag{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:var(--radius-full);background:var(--background);font-weight:700;font-size:12px}.tags{display:flex;flex-wrap:wrap;gap:4px;margin:16px 0 12px}.thumbs{display:flex;gap:8px;margin-top:8px}.thumbs .sc-initials{width:44px;height:44px;border-radius:var(--radius-md);font-size:14px}.thumbs .on{outline:2px solid var(--icon-accent)}</style></head><body>
<div class="sc-overlay" style="min-height:400px;display:grid;place-items:center">
<div class="sc-popup" role="dialog" aria-labelledby="t">
<button class="sc-close" type="button"><svg class="sc-icon" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg><span class="sc-sr-only">Close</span></button>
<div class="sc-popup__body"><div><span class="sc-popup__picture" style="aspect-ratio:1"><span class="sc-initials sc-initials--1" aria-hidden="true">BO</span></span><div class="thumbs"><span class="sc-initials sc-initials--1 on" aria-hidden="true">BO</span><span class="sc-initials sc-initials--2" aria-hidden="true">B2</span></div></div>
<div><h2 class="sc-popup__title" id="t">Bird One</h2><p class="sc-popup__subtitle">Habitat A · 12 Mar 2024</p>
<div class="tags"><span class="tag">Seen</span><span class="tag">Roosted</span><span class="tag">Song A</span><span class="tag">Song B</span></div>
<ul class="sc-sightings"><li><input class="sc-input" type="date" value="2024-03-12" aria-label="Sighting day"></li></ul></div></div>
<div class="sc-actions"><button class="sc-btn sc-btn--neutral" type="button">Edit</button><button class="sc-btn sc-btn--neutral" type="button">Add a sighting</button></div>
</div></div>
</body></html>
